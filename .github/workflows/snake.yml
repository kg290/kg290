name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kg290
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=white&color_dots=#0b0b0b,#171717,#262626,#404040,#d4d4d8
            dist/github-contribution-grid-snake-dark.svg?color_snake=white&color_dots=#0b0b0b,#171717,#262626,#404040,#d4d4d8

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
