name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kg290
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2324292f&color_dots=%23ebedf0,%23d0d7de,%238b949e,%2357606a,%2324292f
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23f0f6fc&color_dots=%23161b22,%2330363d,%236e7681,%238b949e,%23f0f6fc

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
