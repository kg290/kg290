<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="orbBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>
    <radialGradient id="orbCore" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="65%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f1118" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f1118" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ═══ BACKGROUND ═══ -->
  <rect width="1200" height="500" fill="#0a0b10"/>

  <!-- ═══ CELL: GRAPHIC (left, rows 1-2) ═══ -->
  <rect x="16" y="16" width="320" height="340" rx="12" fill="#0f1118" stroke="#1a1d2e" stroke-width="1"/>
  <clipPath id="gfxClip"><rect x="16" y="16" width="320" height="340" rx="12"/></clipPath>
  <g clip-path="url(#gfxClip)">
    <text x="34" y="42" font-family="'Courier New',monospace" font-size="9" fill="#4a4d5e" letter-spacing="2">IDENTITY // CORE</text>
    <text x="318" y="42" text-anchor="end" font-family="'Courier New',monospace" font-size="9" fill="#2a2d3e" letter-spacing="1">01</text>

    <!-- Orb aura -->
    <circle cx="176" cy="195" r="90" fill="url(#orbAura)" filter="url(#orbBlur)" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbit rings -->
    <circle cx="176" cy="195" r="75" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0.12" stroke-dasharray="4 6"/>
    <circle cx="176" cy="195" r="100" fill="none" stroke="#22d3ee" stroke-width="0.4" opacity="0.08" stroke-dasharray="3 8"/>
    <circle cx="176" cy="195" r="125" fill="none" stroke="#ec4899" stroke-width="0.3" opacity="0.06"/>

    <!-- Radial accent lines -->
    <line x1="176" y1="115" x2="176" y2="95" stroke="#a855f7" stroke-width="0.5" opacity="0.15"/>
    <line x1="240" y1="150" x2="255" y2="140" stroke="#22d3ee" stroke-width="0.5" opacity="0.12"/>
    <line x1="112" y1="150" x2="97" y2="140" stroke="#22d3ee" stroke-width="0.5" opacity="0.12"/>
    <line x1="240" y1="240" x2="255" y2="250" stroke="#ec4899" stroke-width="0.5" opacity="0.1"/>
    <line x1="112" y1="240" x2="97" y2="250" stroke="#ec4899" stroke-width="0.5" opacity="0.1"/>
    <line x1="176" y1="275" x2="176" y2="295" stroke="#a855f7" stroke-width="0.5" opacity="0.1"/>

    <!-- Central orb -->
    <circle cx="176" cy="195" r="50" fill="url(#orbCore)"/>

    <!-- Inner geometric detail -->
    <polygon points="176,175 190,205 162,205" fill="none" stroke="#c084fc" stroke-width="0.6" opacity="0.25"/>
    <circle cx="176" cy="195" r="12" fill="none" stroke="#e2e8f0" stroke-width="0.4" opacity="0.15"/>

    <!-- Orbiting dots -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 176 195" to="360 176 195" dur="18s" repeatCount="indefinite"/>
      <circle cx="251" cy="195" r="2.5" fill="#a855f7" filter="url(#glow)" opacity="0.8"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 176 195" to="360 176 195" dur="25s" repeatCount="indefinite"/>
      <circle cx="276" cy="195" r="2" fill="#22d3ee" opacity="0.6"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 176 195" to="0 176 195" dur="30s" repeatCount="indefinite"/>
      <circle cx="301" cy="195" r="1.5" fill="#ec4899" opacity="0.5"/>
    </g>

    <!-- Sparkles -->
    <g opacity="0">
      <line x1="95" y1="85" x2="101" y2="85" stroke="#fff" stroke-width="0.5"/>
      <line x1="98" y1="82" x2="98" y2="88" stroke="#fff" stroke-width="0.5"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite" begin="1s"/>
    </g>
    <g opacity="0">
      <line x1="260" y1="295" x2="266" y2="295" stroke="#fff" stroke-width="0.5"/>
      <line x1="263" y1="292" x2="263" y2="298" stroke="#fff" stroke-width="0.5"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="3.5s" repeatCount="indefinite" begin="2.5s"/>
    </g>

    <!-- Bottom label -->
    <text x="176" y="342" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#2a2d3e" letter-spacing="2">SIGNAL CORE · VECTOR MAP</text>
  </g>

  <!-- ═══ CELL: STATS (left, row 3) ═══ -->
  <rect x="16" y="366" width="320" height="118" rx="12" fill="#0f1118" stroke="#1a1d2e" stroke-width="1"/>
  <text x="34" y="390" font-family="'Courier New',monospace" font-size="9" fill="#4a4d5e" letter-spacing="2">TRACK RECORD</text>
  <line x1="34" y1="398" x2="318" y2="398" stroke="#1a1d2e" stroke-width="0.5"/>
  <!-- Stat 1 -->
  <text x="76" y="440" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="30" font-weight="700" fill="#a855f7" opacity="0">3<animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze" begin="1.2s"/></text>
  <text x="76" y="460" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#6b7280" letter-spacing="1.5">IEEE PAPERS</text>
  <!-- Stat 2 -->
  <text x="176" y="440" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="30" font-weight="700" fill="#22d3ee" opacity="0">3<animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze" begin="1.5s"/></text>
  <text x="176" y="460" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#6b7280" letter-spacing="1.5">CERTIFICATIONS</text>
  <!-- Stat 3 -->
  <text x="276" y="440" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="30" font-weight="700" fill="#ec4899" opacity="0">4x<animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze" begin="1.8s"/></text>
  <text x="276" y="460" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#6b7280" letter-spacing="1.5">FINALIST</text>
  <!-- Dividers -->
  <line x1="126" y1="415" x2="126" y2="465" stroke="#1a1d2e" stroke-width="0.5"/>
  <line x1="226" y1="415" x2="226" y2="465" stroke="#1a1d2e" stroke-width="0.5"/>

  <!-- ═══ CELL: NAME (right, row 1) ═══ -->
  <rect x="346" y="16" width="838" height="180" rx="12" fill="#0f1118" stroke="#1a1d2e" stroke-width="1"/>
  <text x="370" y="48" font-family="'Courier New',monospace" font-size="10" fill="#a855f7" letter-spacing="2" opacity="0">CS ENGINEERING // GENERALIST BUILDER<animate attributeName="opacity" from="0" to="0.8" dur="0.8s" fill="freeze" begin="0.3s"/></text>
  <text x="370" y="94" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="3" opacity="0">KARNAJEET GOSAVI<animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze" begin="0.5s"/></text>
  <text x="370" y="120" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#9ca3af" opacity="0">B.Tech Computer Science · VIT Pune · CGPA 8.96/10<animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze" begin="0.8s"/></text>
  <text x="370" y="150" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#6b7280" opacity="0">Building across software engineering, backend systems, security research,<animate attributeName="opacity" from="0" to="0.8" dur="0.8s" fill="freeze" begin="1s"/></text>
  <text x="370" y="168" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#6b7280" opacity="0">and applied ML. Ship things that work.<animate attributeName="opacity" from="0" to="0.8" dur="0.8s" fill="freeze" begin="1s"/></text>
  <!-- Accent bar -->
  <rect x="370" y="181" width="180" height="2" rx="1" fill="url(#accentLine)" opacity="0.25"/>

  <!-- ═══ CELL: FOCUS (middle-left, row 2) ═══ -->
  <rect x="346" y="206" width="404" height="150" rx="12" fill="#0f1118" stroke="#1a1d2e" stroke-width="1"/>
  <text x="370" y="232" font-family="'Courier New',monospace" font-size="9" fill="#4a4d5e" letter-spacing="2">PRIMARY FOCUS</text>
  <line x1="370" y1="240" x2="730" y2="240" stroke="#1a1d2e" stroke-width="0.5"/>
  <!-- Items -->
  <circle cx="380" cy="262" r="3" fill="#a855f7"/>
  <text x="394" y="266" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#d4d4d8" letter-spacing="0.5">SOFTWARE ENGINEERING</text>
  <circle cx="380" cy="286" r="3" fill="#22d3ee"/>
  <text x="394" y="290" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#d4d4d8" letter-spacing="0.5">SECURITY RESEARCH</text>
  <circle cx="380" cy="310" r="3" fill="#ec4899"/>
  <text x="394" y="314" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#d4d4d8" letter-spacing="0.5">APPLIED ML</text>
  <circle cx="380" cy="334" r="3" fill="#a855f7"/>
  <text x="394" y="338" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#d4d4d8" letter-spacing="0.5">BACKEND SYSTEMS</text>

  <!-- ═══ CELL: DOMAINS (middle-right, row 2) ═══ -->
  <rect x="760" y="206" width="424" height="150" rx="12" fill="#0f1118" stroke="#1a1d2e" stroke-width="1"/>
  <text x="784" y="232" font-family="'Courier New',monospace" font-size="9" fill="#4a4d5e" letter-spacing="2">DOMAIN SIGNALS</text>
  <line x1="784" y1="240" x2="1164" y2="240" stroke="#1a1d2e" stroke-width="0.5"/>
  <!-- Left column -->
  <text x="784" y="268" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#d4d4d8" letter-spacing="1.5">BACKEND</text>
  <text x="784" y="292" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#d4d4d8" letter-spacing="1.5">SECURITY</text>
  <text x="784" y="316" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#d4d4d8" letter-spacing="1.5">COMPUTER VISION</text>
  <!-- Right column -->
  <text x="970" y="268" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#d4d4d8" letter-spacing="1.5">ML / DL</text>
  <text x="970" y="292" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#d4d4d8" letter-spacing="1.5">NLP</text>
  <text x="970" y="316" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#d4d4d8" letter-spacing="1.5">SYSTEMS</text>

  <!-- ═══ CELL: TAGLINE (bottom-middle, row 3) ═══ -->
  <rect x="346" y="366" width="530" height="118" rx="12" fill="#0f1118" stroke="#1a1d2e" stroke-width="1"/>
  <text x="370" y="390" font-family="'Courier New',monospace" font-size="9" fill="#4a4d5e" letter-spacing="2">SIGNAL</text>
  <line x1="370" y1="398" x2="856" y2="398" stroke="#1a1d2e" stroke-width="0.5"/>
  <text x="370" y="432" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" font-weight="600" fill="#d4d4d8" letter-spacing="1">BUILD WIDELY · SHIP CLEANLY · STAY CURIOUS</text>
  <line x1="370" y1="448" x2="560" y2="448" stroke="url(#accentLine)" stroke-width="1" opacity="0.3"/>
  <text x="370" y="468" font-family="'Courier New',monospace" font-size="10" fill="#6b7280" letter-spacing="1">RELIABLE SYSTEMS // SOFTWARE · SECURITY · RESEARCH</text>

  <!-- ═══ CELL: MODE (bottom-right, row 3) ═══ -->
  <rect x="886" y="366" width="298" height="118" rx="12" fill="#0f1118" stroke="#1a1d2e" stroke-width="1"/>
  <text x="910" y="390" font-family="'Courier New',monospace" font-size="9" fill="#4a4d5e" letter-spacing="2">MODE</text>
  <line x1="910" y1="398" x2="1164" y2="398" stroke="#1a1d2e" stroke-width="0.5"/>
  <!-- Pulsing status indicator -->
  <circle cx="1035" cy="430" r="6" fill="#a855f7" opacity="0.8">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1035" cy="430" r="6" fill="none" stroke="#a855f7" stroke-width="1" opacity="0">
    <animate attributeName="r" values="6;18" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1035" y="460" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#d4d4d8" letter-spacing="3">BUILDING</text>

  <!-- ═══ OUTER FRAME ═══ -->
  <rect x="0.5" y="0.5" width="1199" height="499" fill="none" stroke="#1a1d2e" stroke-width="0.5" rx="4"/>
</svg>
