<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fadeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08090d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.4" fill="#fff" opacity="0.035"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="120" fill="#08090d"/>
  <rect width="1200" height="120" fill="url(#grid)"/>

  <!-- Gradient line across top -->
  <line x1="100" y1="20" x2="1100" y2="20" stroke-width="0.5" opacity="0.3">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="6s" repeatCount="indefinite"/>
  </line>
  <linearGradient id="topLine" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
    <stop offset="25%" stop-color="#a855f7"/>
    <stop offset="50%" stop-color="#22d3ee"/>
    <stop offset="75%" stop-color="#ec4899"/>
    <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
  </linearGradient>
  <line x1="100" y1="20" x2="1100" y2="20" stroke="url(#topLine)" stroke-width="0.5" opacity="0.3">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- Scattered nodes -->
  <circle cx="80" cy="50" r="1.5" fill="#a855f7" opacity="0.3">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="75" r="1" fill="#22d3ee" opacity="0.25">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="350" cy="55" r="1.5" fill="#a855f7" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="4.5s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="600" cy="65" r="2" fill="#22d3ee" filter="url(#glow)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="50" r="1.5" fill="#ec4899" opacity="0.25">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="1000" cy="70" r="1" fill="#a855f7" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="4s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle cx="1120" cy="45" r="1.5" fill="#22d3ee" opacity="0.3">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="5s" repeatCount="indefinite" begin="3s"/>
  </circle>

  <!-- Thin connection lines -->
  <g fill="none" stroke-width="0.4">
    <line x1="80" y1="50" x2="200" y2="75" stroke="#a855f7" stroke-opacity="0.06"/>
    <line x1="200" y1="75" x2="350" y2="55" stroke="#22d3ee" stroke-opacity="0.05"/>
    <line x1="350" y1="55" x2="600" y2="65" stroke="#a855f7" stroke-opacity="0.05"/>
    <line x1="600" y1="65" x2="850" y2="50" stroke="#22d3ee" stroke-opacity="0.05"/>
    <line x1="850" y1="50" x2="1000" y2="70" stroke="#ec4899" stroke-opacity="0.05"/>
    <line x1="1000" y1="70" x2="1120" y2="45" stroke="#a855f7" stroke-opacity="0.06"/>
  </g>

  <!-- Signal particle -->
  <circle r="1" fill="#a855f7" filter="url(#glow)" opacity="0.7">
    <animateMotion dur="8s" repeatCount="indefinite" path="M80,50 L200,75 L350,55 L600,65 L850,50 L1000,70 L1120,45"/>
  </circle>

  <!-- Pulse -->
  <g opacity="0.08">
    <polyline points="0,0 20,0 23,-5 26,8 29,-3 32,0 50,0" fill="none" stroke="#a855f7" stroke-width="0.6" transform="translate(575, 95)"/>
    <animate attributeName="opacity" values="0.04;0.14;0.04" dur="2.5s" repeatCount="indefinite"/>
  </g>

  <!-- Frame -->
  <rect x="0.5" y="0.5" width="1199" height="119" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0.04" rx="2"/>
</svg>
